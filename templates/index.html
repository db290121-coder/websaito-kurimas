<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Freelancer Invoices</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="hero">
    <h1>Freelancer Invoices</h1>
    <p>Paprastas ir galingas įrankis jūsų pajamoms sekti bei mokesčiams skaičiuoti.</p>
</header>

<main class="container">
    <section class="form-card">
        <h3>Pridėti naują sąskaitą</h3>
        <form id="invoiceForm">
            <div class="input-group">
                <label>Klientas <i class="fas fa-info-circle tooltip"><span class="tooltiptext">Įmonės arba asmens pavadinimas.</span></i></label>
                <input type="text" id="client" placeholder="Pvz. UAB „Pavyzdys“" required>
            </div>
            
            <div class="input-group">
                <label>Suma <i class="fas fa-info-circle tooltip"><span class="tooltiptext">Sąskaitos suma prieš mokesčius (Bruto).</span></i></label>
                <input type="number" id="amount" placeholder="0.00" required>
            </div>

            <div class="input-group">
                <label>Data <i class="fas fa-info-circle tooltip"><span class="tooltiptext">Sąskaitos išrašymo data.</span></i></label>
                <input type="date" id="date" required>
            </div>

            <button type="submit" class="btn-primary">Pridėti sąskaitą</button>
        </form>
    </section>

    <section class="table-card">
        <h3>Sąskaitų istorija</h3>
        <table id="invoiceTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Klientas</th>
                    <th>Suma (€)</th>
                    <th>Data</th>
                    <th class="tax-col">Mokesčiai (GPM 15%) <i class="fas fa-info-circle tooltip"><span class="tooltiptext">Automatiškai apskaičiuotas pajamų mokestis.</span></i></th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </section>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
