<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nustatymai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div id="toastContainer" class="toast-container"></div>
    <nav class="topbar">
        <div class="topbar-inner">
            <div class="brand-group">
                <div class="brand-icon"><i class="fa-solid fa-rocket"></i></div>
                <div>
                    <div class="brand-name">FreelanceFlow</div>
                    <div class="brand-tagline">Invoice & finance hub</div>
                </div>
            </div>
            <ul class="topbar-menu">
                <li><a href="/" class="topbar-link">Apžvalga</a></li>
                <li><a href="/archive.html" class="topbar-link">Sąskaitų archyvas</a></li>
                <li><a href="/analytics.html" class="topbar-link">Gilioji analizė</a></li>
                <li><a href="/settings.html" class="topbar-link active">Nustatymai</a></li>
            </ul>
            <div class="topbar-actions">
                <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <section class="landing-card p-4 rounded-4 shadow-sm">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3">
                        <div>
                            <span class="eyebrow text-uppercase text-primary fw-semibold"><i class="fa-solid fa-gear"></i> Nustatymai</span>
                            <h1 class="display-6 mt-3 fw-bold">Mokesčių tarifų valdymas</h1>
                            <p class="text-muted mb-0">Čia įrašykite GPM, Sodra ir kitus parametrus, kurių šie skaičiavimai naudos visose svetainės dalyse.</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <section class="card dashboard-card shadow-sm">
                    <div class="card-body">
                        <form id="settingsForm" class="row g-4">
                            <div class="col-12">
                                <h2 class="h5 mb-3"><i class="fa-solid fa-percent"></i> Mokesčių tarifai</h2>
                            </div>
                            <div class="col-md-6">
                                <label for="gpmPercent" class="form-label">GPM (%)</label>
                                <input id="gpmPercent" type="number" class="form-control" step="0.01" min="0" placeholder="15" required>
                            </div>
                            <div class="col-md-6">
                                <label for="expenseDeductionPercent" class="form-label">Išlaidų atskaitymas (%)</label>
                                <input id="expenseDeductionPercent" type="number" class="form-control" step="0.01" min="0" placeholder="30" required>
                            </div>
                            <div class="col-md-6">
                                <label for="vsdPercent" class="form-label">VSD (%)</label>
                                <input id="vsdPercent" type="number" class="form-control" step="0.01" min="0" placeholder="9" required>
                            </div>
                            <div class="col-md-6">
                                <label for="psdPercent" class="form-label">PSD (%)</label>
                                <input id="psdPercent" type="number" class="form-control" step="0.01" min="0" placeholder="6.98" required>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary px-4 py-3">Išsaugoti</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-contact">Contact: daniilbklnv@email.com</div>
            <div class="footer-social">
                <a href="https://t.me/jusu_vartotojo_vardas" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://twitter.com/DaniilB287715" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="https://linkedin.com/in/jusu_vartotojo_vardas" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                <a href="https://github.com/DaniilBolshoj" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
